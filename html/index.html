<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Upload Large File</h1>
    <input id="fileInput" type="file" multiple />
    <script>
      const inputFile = document.querySelector('#fileInput');

      const chunkSize = 140 * 1024;

      inputFile.onchange = async function () {
        const file = inputFile.files[0],
          chunks = [];
        let startPos = 0;

        while (startPos < file.size) {
          chunks.push(file.slice(startPos, startPos + chunkSize));
          startPos += chunkSize;
        }

        if (!chunks.length) return;

        const fileNameRandom = Math.random().toString().slice(2, 7);
        const chunkPromise = [];

        chunks.map((ck, index) => {
          const data = new FormData();
          const nameFileFinal = fileNameRandom + '-' + file.name + '-' + index;
          data.set('name', nameFileFinal);
          //   data.set('numFile', 20);
          //   inputFile.files.forEach((element) => {
          data.append('files', ck);
          //   });

          chunkPromise.push(
            axios.post('http://localhost:3000/user/upload/large-file', data),
          );
          //   console.log(' >> rs >>', rs);
        });

        await Promise.all(chunkPromise)

        const rs = await get(
          'http://localhost:3000/user/merge/file?file=chunks-' +
            fileNameRandom +
            '-' +
            file.name,
        );
      };
    </script>
  </body>
</html>
